# Publishes quackjvm to Maven Central when a v* tag is pushed.
#
# This workflow does nothing until a human adds four repository secrets under
# Settings -> Secrets and variables -> Actions. An automated agent cannot create them.
#
#   CENTRAL_USERNAME  username half of the Central Portal user token (central.sonatype.com/usertoken)
#   CENTRAL_TOKEN     password half of that token
#   GPG_PRIVATE_KEY   ASCII-armored private key: gpg --armor --export-secret-keys <KEYID>
#   GPG_PASSPHRASE    passphrase for that key
#
# It also assumes the release profile described in RELEASING.md section 2.3 has been added to the
# parent pom.xml, and that the version has been set to a non-SNAPSHOT value.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          # Writes ~/.m2/settings.xml with a <server> whose id is server-id, taking the
          # credentials from the named environment variables at build time, and imports the
          # GPG key so maven-gpg-plugin can sign.
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Verify the tag matches the project version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          POM=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          echo "tag=$TAG pom=$POM"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$TAG" != "$POM" ]; then
            echo "Tag $GITHUB_REF_NAME does not match project version $POM" >&2
            exit 1
          fi
          case "$POM" in
            *-SNAPSHOT) echo "Refusing to publish a SNAPSHOT version" >&2; exit 1 ;;
          esac

      - name: Build and test
        run: mvn -B --no-transfer-progress clean verify

      # Builds the signed bundle without contacting the Portal. Catches missing signatures,
      # javadoc failures and metadata problems before anything leaves the runner.
      - name: Dry run the release bundle
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B --no-transfer-progress -Prelease -DskipPublishing=true deploy

      - name: Upload the bundle as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: central-bundle
          path: target/central-publishing/central-bundle.zip
          if-no-files-found: warn

      # The overrides force automatic publishing, because there is nobody to press the Publish
      # button in CI. If they do not take effect, set <autoPublish>true</autoPublish> and
      # <waitUntil>published</waitUntil> in the pom instead and remove the two -D flags.
      - name: Publish to Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: >
          mvn -B --no-transfer-progress -Prelease
          -Dcentral.autoPublish=true
          -Dcentral.waitUntil=published
          deploy
